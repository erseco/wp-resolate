---
name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '.github/*.md'
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**.md'
      - '.github/*.md'
  # The LibreOffice-WASM conversion spec downloads a browser bundle and needs a
  # cross-origin-isolated context, so it is too slow and too flaky to gate every
  # PR. It runs on a schedule instead, and on demand from the Actions tab.
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      wasm:
        description: 'Run the LibreOffice-WASM E2E spec'
        type: boolean
        default: false

# Cancel previous runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_PROCESS_TIMEOUT: 0
  COMPOSER_NO_AUDIT: 1

# The Playground preview link is posted on each PR by
# .github/workflows/playground-preview.yml (WordPress/action-wp-playground-pr-preview).
jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # gd is here for composer, not for us: setasign/fpdf declares
          # `ext-gd` as a hard requirement, so `composer install` refuses to
          # run without it. The plugin only embeds PNG and JPEG, which FPDF
          # parses itself; gd would only matter for GIF.
          extensions: mbstring, intl, curl, dom, json, pdo, mysql, xml, zip, gd
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist

      - name: Validate Composer configuration and runtime requirements
        run: |
          composer validate --no-check-publish
          composer check-platform-reqs

      - name: Check PHP syntax on PHP 8.3
        run: composer lint:syntax

      - name: Run WordPress Coding Standards
        run: make lint

      - name: Check complexity budget (PHPMD)
        run: make phpmd

      - name: Install npm dependencies
        run: npm ci

      # Runs before wp-env so a JS regression fails in seconds rather than
      # after the container boot and the PHP suite.
      - name: Run JavaScript unit tests
        run: npm run test:unit-js

      # The jest run enforces its own per-module floors (tests/js/jest.config.js);
      # the report is kept as an artifact so a JS coverage drop can be read
      # without rerunning the suite.
      - name: Upload JavaScript coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report-js
          path: artifacts/coverage-js/
          retention-days: 30

      - name: Start wp-env with coverage
        run: |
          for attempt in 1 2 3; do
            if npx wp-env start --config=.wp-env.docker.json --xdebug=coverage; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "wp-env start failed on attempt ${attempt}; clearing the partial checkout and retrying."
            rm -rf "$HOME/wp-env"
            sleep $((attempt * 10))
          done

      - name: Verify wp-env uses PHP 8.3
        run: |
          for container in cli tests-cli; do
            npx wp-env run "$container" --config=.wp-env.docker.json php -r 'echo PHP_VERSION, PHP_EOL; exit(PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION === 3 ? 0 : 1);'
          done

      - name: Run plugin check
        run: make check-plugin

      - name: Run unit tests with coverage
        run: make test-coverage

      - name: Extract coverage percentage
        id: coverage
        if: always()
        run: |
          if [ -f artifacts/coverage/coverage.txt ]; then
            COVERAGE=$(grep -oP 'Lines:\s+\K[\d.]+(?=%)' artifacts/coverage/coverage.txt | head -1 || echo "0")
            echo "percentage=${COVERAGE}" >> "$GITHUB_OUTPUT"
            # Determine badge color based on coverage
            if (( $(echo "$COVERAGE >= 80" | bc -l) )); then
              echo "color=brightgreen" >> "$GITHUB_OUTPUT"
            elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then
              echo "color=yellow" >> "$GITHUB_OUTPUT"
            elif (( $(echo "$COVERAGE >= 40" | bc -l) )); then
              echo "color=orange" >> "$GITHUB_OUTPUT"
            else
              echo "color=red" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "percentage=0" >> "$GITHUB_OUTPUT"
            echo "color=red" >> "$GITHUB_OUTPUT"
          fi

      - name: Add coverage to job summary
        if: always()
        run: |
          echo "## 📊 Code Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/coverage/coverage.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "^\s*(Lines|Functions|Classes|Methods):" artifacts/coverage/coverage.txt >> "$GITHUB_STEP_SUMMARY" || echo "No coverage data"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Coverage report not generated" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: artifacts/coverage/html/
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: artifacts/coverage/clover.xml
          fail_ci_if_error: false

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The suite is split in two halves that run on separate machines: each
    # shard boots its own wp-env, so the WP-CLI fixtures of one shard can never
    # collide with the other's.
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2 ]
    steps:
      - uses: actions/checkout@v7

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install npm dependencies
        run: npm ci

      # --no-scripts on purpose: post-install-cmd overwrites the committed
      # runtime vendor trees under admin/vendor and includes/vendor, and the
      # suite must exercise those exactly as they ship.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # Required by setasign/fpdf's `ext-gd`; setup-php's default set has
          # zlib but not gd, and `--no-scripts` does not skip platform checks.
          extensions: gd
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Playwright system deps
        run: npx playwright install-deps chromium

      - name: Start wp-env
        run: |
          for attempt in 1 2 3; do
            if npx wp-env start --config=.wp-env.docker.json; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "wp-env start failed on attempt ${attempt}; clearing the partial checkout and retrying."
            rm -rf "$HOME/wp-env"
            sleep $((attempt * 10))
          done

      - name: Run E2E tests
        run: make test-e2e-docker ARGS="--shard=${{ matrix.shard }}/2"
        env:
          CI: true
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Upload E2E artifacts on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: artifacts/
          retention-days: 7

  # The LibreOffice-WASM conversion path is the one browser flow the per-PR
  # gate cannot afford (it downloads the LibreOffice bundle and needs a
  # cross-origin-isolated context), so playwright.config.js ignores its spec
  # unless DOCUMENTATE_E2E_WASM is set. It is checked here instead: weekly, and
  # on demand from the Actions tab ("Run workflow" with the WASM box ticked).
  e2e-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || inputs.wasm
    steps:
      - uses: actions/checkout@v7

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install npm dependencies
        run: npm ci

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Playwright system deps
        run: npx playwright install-deps chromium

      - name: Start wp-env
        run: npx wp-env start --config=.wp-env.docker.json

      - name: Run the WASM conversion E2E spec
        run: make test-e2e-wasm
        env:
          CI: true
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Upload E2E artifacts on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-wasm
          path: artifacts/
          retention-days: 7

  # Sharding renames the e2e checks to "e2e (1)" / "e2e (2)", which a branch
  # protection rule requiring a check literally named "e2e" would never see.
  # This job keeps one stable name to require, whatever the shard count is.
  e2e-required:
    runs-on: ubuntu-latest
    needs: e2e
    if: always()
    steps:
      - name: Check every E2E shard passed
        run: |
          if [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "E2E shards finished with: ${{ needs.e2e.result }}"
            exit 1
          fi
          echo "Every E2E shard passed."

