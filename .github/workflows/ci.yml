---
name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '.github/*.md'
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**.md'
      - '.github/*.md'

# Cancel previous runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_PROCESS_TIMEOUT: 0
  COMPOSER_NO_AUDIT: 1

# The Playground preview link is posted on each PR by
# .github/workflows/playground-preview.yml (WordPress/action-wp-playground-pr-preview).
jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # gd is here for composer, not for us: setasign/fpdf declares
          # `ext-gd` as a hard requirement, so `composer install` refuses to
          # run without it. The plugin only embeds PNG and JPEG, which FPDF
          # parses itself; gd would only matter for GIF.
          extensions: mbstring, intl, curl, dom, json, pdo, mysql, xml, zip, gd
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist

      - name: Install gettext
        run: sudo apt-get install -y gettext

      - name: Check untranslated strings
        run: make check-untranslated

      - name: Run WordPress Coding Standards
        run: make lint

      - name: Install npm dependencies
        run: npm ci

      # Runs before wp-env so a JS regression fails in seconds rather than
      # after the container boot and the PHP suite.
      - name: Run JavaScript unit tests
        run: npm run test:unit-js

      - name: Start wp-env with coverage
        run: |
          for attempt in 1 2 3; do
            if npx wp-env start --config=.wp-env.docker.json --xdebug=coverage; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "wp-env start failed on attempt ${attempt}; clearing the partial checkout and retrying."
            rm -rf "$HOME/wp-env"
            sleep $((attempt * 10))
          done

      - name: Run plugin check
        run: make check-plugin

      - name: Run unit tests with coverage
        run: make test-coverage

      - name: Extract coverage percentage
        id: coverage
        if: always()
        run: |
          if [ -f artifacts/coverage/coverage.txt ]; then
            COVERAGE=$(grep -oP 'Lines:\s+\K[\d.]+(?=%)' artifacts/coverage/coverage.txt | head -1 || echo "0")
            echo "percentage=${COVERAGE}" >> $GITHUB_OUTPUT
            # Determine badge color based on coverage
            if (( $(echo "$COVERAGE >= 80" | bc -l) )); then
              echo "color=brightgreen" >> $GITHUB_OUTPUT
            elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then
              echo "color=yellow" >> $GITHUB_OUTPUT
            elif (( $(echo "$COVERAGE >= 40" | bc -l) )); then
              echo "color=orange" >> $GITHUB_OUTPUT
            else
              echo "color=red" >> $GITHUB_OUTPUT
            fi
          else
            echo "percentage=0" >> $GITHUB_OUTPUT
            echo "color=red" >> $GITHUB_OUTPUT
          fi

      - name: Add coverage to job summary
        if: always()
        run: |
          echo "## 📊 Code Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f artifacts/coverage/coverage.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "^\s*(Lines|Functions|Classes|Methods):" artifacts/coverage/coverage.txt >> $GITHUB_STEP_SUMMARY || echo "No coverage data"
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Coverage report not generated" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: artifacts/coverage/html/
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: artifacts/coverage/clover.xml
          fail_ci_if_error: false

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install npm dependencies
        run: npm ci

      # `make test-e2e` builds the runtime translation files before starting the
      # environment, which needs the WP-CLI i18n command from require-dev.
      # --no-scripts on purpose: post-install-cmd overwrites the committed
      # runtime vendor trees under admin/vendor and includes/vendor, and the
      # suite must exercise those exactly as they ship.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # Required by setasign/fpdf's `ext-gd`; setup-php's default set has
          # zlib but not gd, and `--no-scripts` does not skip platform checks.
          extensions: gd
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Playwright system deps
        run: npx playwright install-deps chromium

      - name: Start wp-env
        run: |
          for attempt in 1 2 3; do
            if npx wp-env start --config=.wp-env.docker.json; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "wp-env start failed on attempt ${attempt}; clearing the partial checkout and retrying."
            rm -rf "$HOME/wp-env"
            sleep $((attempt * 10))
          done

      - name: Run E2E tests
        run: make test-e2e-docker
        env:
          CI: true
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Upload E2E artifacts on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: artifacts/
          retention-days: 7
