---
name: Release

on:
  release:
    types: [published]
  # Manual runs build and upload the ZIP as a workflow artifact without
  # touching any release, so the packaging path can be exercised on demand.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version label for the package name (e.g. 1.2.3). Defaults to a dated dev label."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    steps:
      # Checkout the code
      - uses: actions/checkout@v7

      - name: Set environment variables
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            RAW_TAG="${GITHUB_REF##*/}"
            VERSION_TAG="${RAW_TAG#v}"  # Delete the initial 'v' if exists
            if [ -z "$VERSION_TAG" ]; then
              echo "::error::Could not determine release tag" >&2
              exit 1
            fi
          else
            VERSION_TAG="${INPUT_TAG#v}"
            if [ -z "$VERSION_TAG" ]; then
              VERSION_TAG="manual-$(date +%Y%m%d)-${GITHUB_SHA::7}"
            fi
          fi
          echo "RELEASE_TAG=${VERSION_TAG}" >> $GITHUB_ENV

      # The LibreOffice WASM glue under admin/vendor is generated rather than
      # committed, and `make package` regenerates it from node_modules.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # The runtime translation files are generated the same way, which needs
      # the WP-CLI i18n command from require-dev. --no-scripts on purpose:
      # post-install-cmd copies the committed runtime vendor trees under
      # admin/vendor and includes/vendor, and a release must ship those exactly
      # as reviewed rather than as re-resolved at build time.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # Required by setasign/fpdf's `ext-gd`; setup-php's default set has
          # zlib but not gd, and `--no-scripts` does not skip platform checks.
          extensions: gd
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Create package using the Makefile
        run: make package VERSION=${RELEASE_TAG}

      # Always kept, so a manual run leaves something downloadable to inspect.
      - name: Upload ZIP as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: documentate-${{ env.RELEASE_TAG }}
          path: documentate-${{ env.RELEASE_TAG }}.zip

      - name: Upload ZIP to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: documentate-${{ env.RELEASE_TAG }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # - name: Deploy to WordPress
      #   uses: 10up/action-wordpress-plugin-deploy@v2.2.2
      #   with:
      #     plugin_slug: documentate
      #     svn_username: ${{ secrets.WP_SVN_USERNAME }}
      #     svn_password: ${{ secrets.WP_SVN_PASSWORD }}
